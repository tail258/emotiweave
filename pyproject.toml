[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotiweave"
version = "1.0.0"
description = "A correctable, uncertainty-aware multimodal affect interaction lab."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper>=1.1.0",
  "gradio>=5.0,<7",
  "mediapipe>=0.10.14",
  "numpy>=1.26,<3",
  "opencv-python>=4.9",
  "plotly>=5.24",
  "pyttsx3>=2.90",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
emotiweave = "sentientbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
