# EmotiWeave｜情绪织谱：ModelScope 公网演示配置

system:
  name: "EmotiWeave"
  host: "0.0.0.0"
  port: 7860
  open_browser: false
  log_level: "INFO"

vision:
  enabled: true
  model_path: "assets/models/face_landmarker.task"
  max_faces: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  stream_every: 0.30
  draw_landmarks: true

audio:
  enabled: false
  feature_analysis_enabled: true
  model_size: "small"
  device: "cpu"
  compute_type: "int8"
  language: "zh"
  beam_size: 3
  vad_filter: true
  min_duration_seconds: 0.35
  max_analysis_seconds: 20

brain:
  enabled: false
  model: "qwen2.5:3b"
  host: "http://127.0.0.1:11434"
  timeout_seconds: 2
  warmup_on_start: false
  stream: false
  keep_alive: "0"
  max_history_turns: 6
  temperature: 0.35

voice:
  enabled: false
  speed: 165
  volume: 1.0
  language: "zh"

affect:
  smoothing_half_life: 0.75
  stale_after_seconds: 1.5
  conflict_threshold: 0.65
  vision_valence_weight: 1.0
  vision_arousal_weight: 1.0
  text_valence_weight: 1.0
  text_arousal_weight: 1.0
  audio_arousal_weight: 1.10
  minimum_modality_confidence: 0.05
  conflict_min_confidence: 0.42
  conflict_penalty: 0.62
  agreement_base: 0.78
  agreement_bonus: 0.22
  text_hold_seconds: 8.0
  audio_hold_seconds: 8.0
  calibration_samples: 24
  correction_learning_rate: 0.22

privacy:
  log_events: false
  store_transcripts: false
  store_raw_media: false
  log_directory: "data/sessions"
